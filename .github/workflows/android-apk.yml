name: Build Android APK

# Run it from the "Actions" tab ("Run workflow"), or push a tag like v1.0.0 to also publish a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Configure the app (backend URL etc.)
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          APP_KEY: ${{ secrets.APP_KEY }}
          DEFAULT_LANGUAGE: ${{ vars.DEFAULT_LANGUAGE }}
          LANGUAGES: ${{ vars.LANGUAGES }}
        run: |
          test -n "$BACKEND_URL" || { echo "::error::Add the repository secret BACKEND_URL (https://your-backend...)"; exit 1; }
          npm run configure

      - name: Download offline wake-word model
        run: npm run model

      - name: Prepare signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/jarvis.keystore"
            echo "JARVIS_KEYSTORE_FILE=$RUNNER_TEMP/jarvis.keystore" >> "$GITHUB_ENV"
            echo "Using your release keystore."
          else
            echo "::warning::No KEYSTORE_BASE64 secret: the APK will be signed with the debug key (OK for testing/sideloading, not for Google Play)."
          fi

      - name: Build release APK
        working-directory: mobile/android
        env:
          JARVIS_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          JARVIS_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          JARVIS_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          JARVIS_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ../JARVIS.apk

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-apk
          path: JARVIS.apk

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: JARVIS.apk
